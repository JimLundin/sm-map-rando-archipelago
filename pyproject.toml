[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "smmr-engine"
description = "Map Rando (our fork) as a Python module, for the Super Metroid Map Rando Archipelago world"
requires-python = ">=3.12"   # what Archipelago's installer bundles (3.12; it supports 3.11 to 3.13 from source)
dynamic = ["version"]        # engine/Cargo.toml

[dependency-groups]
dev = ["pytest", "pyright", "backports.zstd", "maturin>=1.9,<2"]

[tool.maturin]
manifest-path = "engine/Cargo.toml"
module-name = "smmr_engine"
profile = "dev-release"      # optimized (randomization is slow otherwise) but incremental; releases build --release

[tool.uv]
# Rebuild the module when the Rust changes (ours or Map Rando's).
cache-keys = [{ file = "pyproject.toml" }, { file = "engine/Cargo.toml" }, { file = "engine/**/*.rs" },
              { file = "MapRandomizer/rust/maprando*/**/*.rs" }]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["world/smmr", "tests", "tools"]
exclude = ["**/__pycache__", "world/smmr/test"]
extraPaths = ["world/smmr", "tools"]
# The tests import their own conftest; the World's adapters see Archipelago (`make typecheck AP=...` links it).
executionEnvironments = [
  { root = "tests/core", extraPaths = ["tests/core", "world/smmr", "tools"] },
  { root = "tests/rom", extraPaths = ["tests/rom", "world/smmr", "tools"] },
  { root = "tests/engine", extraPaths = ["world/smmr", "tools"] },
  { root = "world/smmr", extraPaths = ["build/archipelago"] },
  { root = "tools", extraPaths = ["world/smmr", "tools"] },
]
strict = ["world/smmr/core", "tests/core", "tools"]
reportMissingImports = "warning"
reportMissingModuleSource = "none"
