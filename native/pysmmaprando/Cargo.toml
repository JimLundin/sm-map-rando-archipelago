[package]
name = "pysmmaprando"
version = "0.123.1"
edition = "2024"
description = "Python bindings to the Super Metroid Map Randomizer, for use by the Archipelago world"

[lib]
name = "pysmmaprando"
crate-type = ["cdylib"]

[dependencies]
maprando = { path = "../../MapRandomizer/rust/maprando" }
maprando-game = { path = "../../MapRandomizer/rust/maprando-game" }
anyhow = "1.0.68"
hashbrown = "0.14.5"
log = "0.4.17"
env_logger = "0.10.0"
rand = "0.8.5"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
zstd = "0.12.2"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "generate-import-lib"] }

# Build OpenSSL (used by Map Rando's crypto-hash dependency on Linux) from source, so that wheels don't depend on the
# build or target system's OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# Standalone workspace: the Map Rando crates are path dependencies in the MapRandomizer submodule (with the patches in
# patches/ applied, see tools/prepare_upstream.py).
[workspace]

[profile.release]
codegen-units = 1
