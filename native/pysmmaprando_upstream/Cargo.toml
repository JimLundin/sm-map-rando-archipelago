[package]
name = "pysmmaprando_upstream"
version = "0.123.2"
edition = "2024"
description = "Python bindings to the Super Metroid Map Randomizer, for use by the Archipelago world"

[lib]
name = "pysmmaprando_upstream"
crate-type = ["cdylib"]

[dependencies]
# without the website's seed repository (cloud storage) and the hashing used by Map Rando's binaries (OpenSSL), see
# patches/
maprando = { path = "../../MapRandomizer/rust/maprando", default-features = false }
maprando-game = { path = "../../MapRandomizer/rust/maprando-game" }
anyhow = "1.0.68"
hashbrown = "0.14.5"
log = "0.4.17"
env_logger = "0.10.0"
rand = "0.8.5"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
zstd = "0.12.2"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311", "generate-import-lib"] }

# Standalone workspace: the Map Rando crates are path dependencies in the MapRandomizer submodule (with the patches in
# patches/ applied, see tools/prepare_upstream.py).
[workspace]

[profile.release]
codegen-units = 1

# Local development builds (maturin develop --profile dev-release): optimized, so that generation stays fast, but with
# parallel and incremental code generation, so that rebuilding after a change is quick.
[profile.dev-release]
inherits = "release"
codegen-units = 16
incremental = true
