[package]
name = "smmr-engine"
version = "0.1.0"
edition = "2024"
description = "Map Rando (our fork) as a Python module, for the Archipelago world"
license = "MIT"

[lib]
name = "smmr_engine"
crate-type = ["cdylib"]

[dependencies]
maprando = { path = "../MapRandomizer/rust/maprando" }
maprando-game = { path = "../MapRandomizer/rust/maprando-game" }
maprando-logic = { path = "../MapRandomizer/rust/maprando-logic" }
anyhow = "1.0.68"
rand = "0.8.5"
serde = "1.0.152"
serde_derive = "1.0.152"
serde_json = "1.0.91"
log = "0.4.17"
pyo3 = { version = "0.29", features = ["abi3-py312"] }

[workspace]

[profile.release]
codegen-units = 1

# Optimized like release (randomization is slow unoptimized), but incremental and parallel, so a rebuild after an
# edit to the engine takes seconds.
[profile.dev-release]
inherits = "release"
codegen-units = 256
incremental = true
