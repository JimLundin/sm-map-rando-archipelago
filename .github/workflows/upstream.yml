# Weekly check for new Map Rando versions: updates the MapRandomizer submodule to upstream main, regenerates the
# options and data, and opens a pull request (built and tested by the Build workflow) for review.
name: Upstream update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check for a new upstream commit
        id: check
        run: |
          current="$(git ls-tree HEAD MapRandomizer | awk '{print $3}')"
          latest="$(git ls-remote https://github.com/blkerby/MapRandomizer.git refs/heads/main | cut -f1)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then echo "Up to date"; echo "update=false" >> "$GITHUB_OUTPUT";
          elif git ls-remote --exit-code origin "refs/heads/upstream/${latest:0:12}" > /dev/null; then
            echo "Already proposed"; echo "update=false" >> "$GITHUB_OUTPUT";
          else echo "update=true" >> "$GITHUB_OUTPUT"; fi
      - name: Update the submodule
        if: steps.check.outputs.update == 'true'
        run: |
          git submodule update --init --depth 1 MapRandomizer
          git -C MapRandomizer fetch --depth 1 origin "${{ steps.check.outputs.latest }}"
          git -C MapRandomizer checkout -q "${{ steps.check.outputs.latest }}"
          echo "UPSTREAM_VERSION=$(cat MapRandomizer/rust/VERSION)" >> "$GITHUB_ENV"
      - name: Regenerate
        if: steps.check.outputs.update == 'true'
        id: regen
        run: |
          set +e
          report=report.md
          echo "Updates Map Rando to blkerby/MapRandomizer@${{ steps.check.outputs.latest }} (Map Rando v$UPSTREAM_VERSION)." > $report
          echo >> $report
          if ! python tools/prepare_upstream.py > prepare.log 2>&1; then
            echo "**The patches in patches/ no longer apply: they need to be updated.**" >> $report
            echo '```' >> $report; tail -40 prepare.log >> $report; echo '```' >> $report
            exit 0
          fi
          pip install maturin
          (cd native/pysmmaprando && maturin build --release -o ../../dist/wheels) > native.log 2>&1 || {
            echo "**The native module doesn't build:**" >> $report
            echo '```' >> $report; grep -E '^(error|warning: unused)' -A8 native.log | head -80 >> $report; echo '```' >> $report
            exit 0; }
          pip install dist/wheels/*.whl
          python tools/build_apworld.py --no-zip --allow-upstream-changes > build.log 2>&1 || {
            echo "**Building the world failed:**" >> $report
            echo '```' >> $report; tail -40 build.log >> $report; echo '```' >> $report; exit 0; }
          echo "### Generator output" >> $report
          echo '```' >> $report; grep -E '^(warning: |CHANGED|Wrote .*Options|World version)' build.log >> $report; echo '```' >> $report
          if grep -q CHANGED build.log; then
            echo "**Upstream code mirrored by this repository changed: review it, then run \`python tools/upstream_checks.py --update\`.**" >> $report
          fi
          echo >> $report
          echo "Before merging and releasing, run the ROM test locally:" >> $report
          echo '`SMMR_TEST_ROM=/path/to/rom.sfc python -m pytest worlds/sm_map_rando/test/test_rom_integration.py`' >> $report
      - name: Open a pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="upstream/$(echo ${{ steps.check.outputs.latest }} | cut -c1-12)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git -C MapRandomizer checkout -q -- . 2>/dev/null; git -C MapRandomizer clean -qfd
          git add MapRandomizer worlds tools native/pysmmaprando/Cargo.toml
          git commit -m "Update Map Rando to v$UPSTREAM_VERSION (${{ steps.check.outputs.latest }})"
          git push origin "$branch"
          gh pr create --head "$branch" --title "Update Map Rando to v$UPSTREAM_VERSION" --body-file report.md
          gh workflow run build.yml --ref "$branch"
