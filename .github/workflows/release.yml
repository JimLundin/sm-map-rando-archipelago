# Publish a release when a version tag (v*) is pushed: builds and tests everything, then uploads the .apworld and the
# options template. Run the ROM integration test locally before tagging (it needs a Super Metroid ROM):
#   SMMR_TEST_ROM=/path/to/rom.sfc python -m pytest worlds/sm_map_rando/test/test_rom_integration.py
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apworld
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: template
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("worlds/sm_map_rando/archipelago.json"))["world_version"])')"
          gh release create "$GITHUB_REF_NAME" dist/sm_map_rando.apworld "dist/Super Metroid Map Rando.yaml" \
            --title "Super Metroid Map Rando $version for Archipelago" --generate-notes
