# One job per layer, as the local loops (README): core (seconds), the engine module + generated data, the World in
# Archipelago. uv provides Python 3.12 and the dev tools; `uv sync` builds the engine module (maturin).
name: ci
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with pytest pytest -q tests/core   # no engine needed

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map Rando and the submodules the engine needs
        run: |
          git submodule update --init MapRandomizer
          git -C MapRandomizer submodule update --init sm-json-data rust/lznint asar
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: uv sync
      - run: uv run tools/fetch_data.py && uv run tools/dev.py asar && uv run tools/dev.py mw
      - name: Generated files are up to date
        run: |
          uv run tools/dev.py data
          git diff --exit-code world/smmr/data
      - run: uv run pytest -q tests/engine

  world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git submodule update --init MapRandomizer
          git -C MapRandomizer submodule update --init sm-json-data rust/lznint
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - run: uv sync && uv run tools/fetch_data.py
      - run: git clone --depth 1 https://github.com/ArchipelagoMW/Archipelago.git ../Archipelago
      - run: uv run tools/dev.py typecheck --ap ../Archipelago   # strict for the core, its tests and the tools
      - run: uv run tools/dev.py test-ap --ap ../Archipelago
