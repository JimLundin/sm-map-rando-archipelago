# Build the native module for all platforms, the .apworld and the options template, and run the tests.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  ARCHIPELAGO_VERSION: "0.6.8"

jobs:
  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: windows-x86_64, os: windows-latest, target: x64, manylinux: "" }
          - { name: macos-universal2, os: macos-14, target: universal2-apple-darwin, manylinux: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare Map Rando sources
        run: python tools/prepare_upstream.py
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native/pysmmaprando
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --strip --out ../../dist/wheels
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/wheels/*.whl

  apworld:
    name: Build .apworld
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/wheels
          merge-multiple: true
      - name: Install the native module
        run: pip install dist/wheels/pysmmaprando-*manylinux*x86_64*.whl
      - name: Build the world
        run: python tools/build_apworld.py
      - name: Check that generated files are up to date
        run: |
          git status --porcelain -- worlds tools | grep -v '^??' && {
            echo "::warning::Generated files differ from the repository (run tools/build_apworld.py and commit)";
            git --no-pager diff --stat -- worlds tools; } || true
      - uses: actions/upload-artifact@v7
        with:
          name: apworld
          path: dist/sm_map_rando.apworld

  test:
    name: Test (Archipelago)
    needs: apworld
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: apworld
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-linux-x86_64
          path: wheels
          merge-multiple: true
      - name: Set up Archipelago
        run: |
          git clone --depth 1 --branch "$ARCHIPELAGO_VERSION" https://github.com/ArchipelagoMW/Archipelago.git ../Archipelago
          pip install -r ../Archipelago/requirements.txt pytest pytest-subtests
          pip install wheels/*.whl
          unzip -q sm_map_rando.apworld -d ../Archipelago/worlds
      - name: Run the world's tests
        working-directory: ../Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: python -m pytest worlds/sm_map_rando/test -q
      - name: Generate the options template
        working-directory: ../Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: python "$GITHUB_WORKSPACE/tools/gen_template.py" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        with:
          name: template
          path: dist/Super Metroid Map Rando.yaml
